<!DOCTYPE html>
<html>
<head>
    <title>Lockin - Reminder Time</title>
</head>
<body>
    <h1>What time should we remind you?</h1>
    <form method="POST">
        <label><input type="radio" name="reminder_time" value="19:00" required> 7:00 PM</label><br>
        <label><input type="radio" name="reminder_time" value="20:00"> 8:00 PM</label><br>
        <label><input type="radio" name="reminder_time" value="21:00"> 9:00 PM</label><br>
        <label>Custom: <input type="time" name="custom_time"></label><br>
        <button type="submit">Finish</button>
    </form>
</body>
</html>
