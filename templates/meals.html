<!DOCTYPE html>
<html>
<head>
    <title>Lockin - Your Meals</title>
</head>
<body>
    <h1>Which meals would you like us to plan for you?</h1>
    <p>After finishing sign up, you'll be able to edit your meals, add new ones, and adjust settings in more detail.</p>
    <form method="POST">
        <label><input type="checkbox" name="meals" value="breakfast" checked> Breakfast</label><br>
        <label><input type="checkbox" name="meals" value="lunch" checked> Lunch</label><br>
        <label><input type="checkbox" name="meals" value="dinner" checked> Dinner</label><br>
        <label><input type="checkbox" name="meals" value="snack" checked> Snack</label><br>
        <button type="submit">Next</button>
    </form>
</body>
</html>
