<!DOCTYPE html>
<html>
<head>
    <title>Lockin - Activity Level</title>
</head>
<body>
    <h1>How active are you?</h1>
    <form method="POST">
        <label>
            <input type="radio" name="activity_level" value="sedentary" required>
            Sedentary — little to no exercise, desk job
        </label><br>

        <label>
            <input type="radio" name="activity_level" value="lightly_active">
            Lightly active — light exercise 1-3 days/week
        </label><br>

        <label>
            <input type="radio" name="activity_level" value="moderately_active">
            Moderately active — moderate exercise 3-5 days/week
        </label><br>

        <label>
            <input type="radio" name="activity_level" value="very_active">
            Very active — hard exercise/sports 6-7 days/week
        </label><br>

        <label>
            <input type="radio" name="activity_level" value="extremely_active">
            Extremely active — hard daily exercise/sports + physical job
        </label><br>

        <button type="submit">Next</button>
    </form>
</body>
</html>
