<!DOCTYPE html>
<html>
<head>
    <title>Lockin - Reminders</title>
</head>
<body>
    <h1>Build the habit of following your plan</h1>
    <p>Want a quick end-of-day check-in reminder? If you choose yes, we'll ask for notification permission. We only send meal reminders, never marketing notifications.</p>

    <form method="POST" id="optForm">
        <button type="submit" name="opt_in" value="yes">Yes, I'll check in</button>
        <button type="submit" name="opt_in" value="no">No thanks</button>
    </form>
</body>
</html>
